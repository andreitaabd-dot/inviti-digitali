<!doctype html>
<html lang="it">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fffdf9">
  <title>Alice e Salvatore - Ci sposiamo!</title>

  <!-- Anteprima WhatsApp / Open Graph -->
  <meta name="description" content="Sabato 26 giugno 2027, ore 18:00. Apri il nostro invito e conferma la tua presenza!">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Alice e Salvatore - Ci sposiamo! 🥂">
  <meta property="og:description" content="Sabato 26 giugno 2027, ore 18:00. Apri il nostro invito e conferma la tua presenza!">
  <meta property="og:image" content="https://invitiwow.com/inviti/alice-salvatore/preview.jpg?v=55">
  <meta property="og:url" content="https://invitiwow.com/inviti/alice-salvatore/">
  <meta property="og:locale" content="it_IT">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script defer src="config.js"></script>
  <script defer src="script.js"></script>
</head>

<body>
  <div id="opening" class="opening" aria-label="Apertura invito">
    <div class="opening-inner">
      <p class="opening-kicker">26 GIUGNO 2027</p>
      <h1>Alice e Salvatore</h1>
      <button id="open-envelope" class="envelope-button" type="button" aria-label="Apri la busta">
        <span class="envelope-art"><span class="envelope-letter">A <span>&amp;</span> S</span><span class="envelope-flap"></span><span class="envelope-front"></span><span class="envelope-seal">♥</span></span>
      </button>
      <p class="opening-caption">Un giorno speciale da condividere con voi</p>
      <button id="open-cta" type="button" class="open-cta">Apri la busta</button>
    </div>
  </div>

  <div id="toast-intro" class="toast-intro" aria-hidden="true">
    <div class="toast-glasses">
      <img class="toast-left" alt="" src="assets/spritz-sinistro.png">
      <img class="toast-right" alt="" src="assets/spritz-destro.png">
    </div>
    <p>Cin cin! 🧡</p>
  </div>

  <main class="invito" id="invito">
    <div class="invito-inner">
      <header class="hero">
        <div class="photo-placeholder" data-image="copertina" role="img" aria-label="Foto degli sposi"><span>FOTO COPERTINA</span></div>
        <div class="hero-label">
          <h1 id="nomi"></h1>
          <p id="data"></p>
        </div>
      </header>

      <section class="intro">
        <h2 id="intro-title"></h2>
        <div id="intro-paragraphs"></div>
      </section>

      <section class="childhood" aria-label="Foto da bambini">
        <div class="photo-placeholder" data-image="bambino1"><span>FOTO BAMBINA</span></div>
        <div class="photo-placeholder" data-image="bambino2"><span>FOTO BAMBINO</span></div>
      </section>

      <h2 class="section-heading">Il gran giorno</h2>
      <section class="venue" id="cerimonia">
        <div class="venue-copy"></div>
        <div class="photo-placeholder venue-photo" data-image="cerimonia"><span>FOTO CERIMONIA</span></div>
      </section>
      <section class="venue" id="ricevimento">
        <div class="venue-copy"></div>
        <div class="photo-placeholder venue-photo" data-image="ricevimento"><span>FOTO RICEVIMENTO</span></div>
      </section>

      <section class="rsvp">
        <h2 id="rsvp-title"></h2>
        <p id="rsvp-deadline"></p>
        <form id="rsvp-form">
          <label>Nome <input name="nome" required autocomplete="given-name"></label>
          <label data-field="cognome">Cognome <input name="cognome" autocomplete="family-name"></label>
          <fieldset>
            <legend>Parteciperai?</legend>
            <label><input type="radio" name="presenza" value="si" required> Ci sarò</label>
            <label><input type="radio" name="presenza" value="no"> Non potrò esserci</label>
          </fieldset>
          <label data-field="partecipanti">In quanti sarete? <input name="partecipanti" type="number" min="1" max="30"></label>
          <label data-field="allergie">Allergie o intolleranze <textarea name="allergie" rows="2"></textarea></label>
          <label data-field="messaggio">Messaggio agli sposi <textarea name="messaggio" rows="2"></textarea></label>
          <label data-field="canzone">Una canzone per gli sposi <input name="canzone"></label>
          <button type="submit" id="send">Invia conferma</button>
          <p id="form-status" role="status" aria-live="polite"></p>
        </form>
      </section>

      <section id="dress-code" class="extra">
        <h2></h2>
        <p></p>
      </section>
      <section id="lista-nozze" class="extra">
        <h2></h2>
        <p></p>
        <p class="iban"></p>
      </section>
      <footer>♥</footer>
    </div>
  </main>

  <button id="audio-toggle" type="button" hidden aria-label="Attiva o disattiva musica">♫</button>
  <div id="tapAudioHint" class="tap-audio-hint" hidden aria-hidden="true">🔊</div>
  <audio id="audio" loop preload="none"></audio>
</body>

</html>
